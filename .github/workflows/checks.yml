name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # actions/setup-python has no Python 3.9 build for the current Ubuntu runner, so uv provides
      # the interpreter (a python-build-standalone build) in a virtual environment for every version.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python and the development tools
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" --seed "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" --version
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check
        run: python -m mypy
      - name: Test
        env:
          PYTHONPATH: src
        run: python -W error -m unittest discover -s tests -t . -v
      - name: Install the package and run the command line
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          python -m wesley_python emit --ir "$GITHUB_WORKSPACE/tests/fixtures/hello.ir.json" > hello.py
          cmp hello.py "$GITHUB_WORKSPACE/tests/golden/emit_hello.py"
          wesley-python emit --ir "$GITHUB_WORKSPACE/tests/fixtures/plain.ir.json" | cmp - "$GITHUB_WORKSPACE/tests/golden/emit_plain.py"

  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Python and the development tools
        run: |
          uv venv --python 3.13 --seed "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements-dev.txt
      - name: Build the sdist and wheel
        run: python -m build --outdir "$RUNNER_TEMP/dist" .
      - name: Check them, and install the wheel on Python 3.9 and 3.13
        run: scripts/check-dist "$RUNNER_TEMP/dist" 3.9 3.13
